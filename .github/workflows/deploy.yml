name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy site/ to yomeru-vocab.pages.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 63eaed80634cf526bafd62bbe24232d8
          command: pages deploy site --project-name=yomeru-vocab --branch=main --commit-dirty=true
